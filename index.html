<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day Site</title>
  <!-- Romantic Font: Alex Brush -->
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Alex Brush', cursive;
      background: #000;
      overflow: hidden;
    }
    /* Neon glow effect for text */
    .glow {
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 30px #ff00de,
        0 0 40px #ff00de,
        0 0 50px #ff00de,
        0 0 75px #ff00de;
    }
    /* Bounce animation */
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-15px); }
      60% { transform: translateY(-8px); }
    }
    /* Fade in animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Gradient background animation */
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Heart float animation */
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
    /* Initial Screen */
    #initial-screen {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: fadeIn 2s ease forwards;
    }
    #start-button {
      font-size: 1.8rem;
      padding: 15px 30px;
      border-radius: 12px;
      background-color: #ffc0cb;
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      animation: pulse 2s infinite, bounce 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #start-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #fff;
    }
    /* Valentine Screen */
    #valentine-screen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: fixed;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FF758C, #FF7EB3, #FFB7B2, #FEE2E2);
      background-size: 600% 600%;
      animation: gradientAnimation 20s ease infinite;
    }
    #message {
      font-size: 2.5rem;
      margin-bottom: 40px;
      opacity: 0;
      z-index: 10;
      animation: fadeIn 2s forwards, bounce 2s infinite 2s;
    }
    #button-container {
      display: flex;
      gap: 30px;
      opacity: 0;
      z-index: 10;
      animation: fadeIn 2s forwards 1.2s;
    }
    .valentine-button {
      font-size: 1.8rem;
      padding: 15px 30px;
      border-radius: 12px;
      background-color: #ffc0cb;
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .valentine-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px #fff;
      animation: bounce 0.5s;
    }
    /* Cat Image Styling - positioned at the bottom center */
    #cat {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%) scale(0.5);
      opacity: 0;
      transition: opacity 1s ease, transform 1s ease;
      z-index: 20;
      max-width: 40%;
    }
    /* Tulip Container for Falling Animation */
    #tulip-container {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 5;
    }
    .tulip {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 1;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(-100px) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(360deg);
      }
    }
    /* Heart Container for Floating Hearts */
    #heart-container {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 3;
    }
    .heart {
      position: absolute;
      font-size: 24px;
      color: #ff69b4;
      opacity: 0;
      animation: floatUp 8s linear forwards;
    }
  </style>
</head>
<body>
  <!-- Initial Screen -->
  <div id="initial-screen">
    <button id="start-button">for my baby</button>
  </div>
  
  <!-- Valentine Screen -->
  <div id="valentine-screen">
    <!-- Floating Hearts Container -->
    <div id="heart-container"></div>
    
    <div id="message" class="glow">hi baby, will you be my valentine</div>
    <div id="button-container">
      <button id="yes-button" class="valentine-button">yes</button>
      <button id="no-button" class="valentine-button">no</button>
    </div>
    <!-- Cat Image (cat.png) appears at the bottom center -->
    <img id="cat" src="cat.png" alt="Happy Cat">
  </div>
  
  <!-- Tulip Container -->
  <div id="tulip-container"></div>
  
  <script>
   
    const initialScreen = document.getElementById('initial-screen');
    const startButton = document.getElementById('start-button');
    const valentineScreen = document.getElementById('valentine-screen');
    const message = document.getElementById('message');
    const yesButton = document.getElementById('yes-button');
    const noButton = document.getElementById('no-button');
    const cat = document.getElementById('cat');
    const tulipContainer = document.getElementById('tulip-container');
    const heartContainer = document.getElementById('heart-container');
    
    let noClickCount = 0;
    
    startButton.addEventListener('click', () => {
      initialScreen.style.animation = 'fadeOut 1.5s forwards';
      setTimeout(() => {
        initialScreen.style.display = 'none';
        valentineScreen.style.display = 'flex';
        valentineScreen.style.animation = 'fadeIn 1.5s forwards';
        // Start generating hearts in the background
        setInterval(createHeart, 1000);
      }, 1500);
    });
    
    noButton.addEventListener('click', () => {
      noClickCount++;
      let scaleFactor = 1 + noClickCount * 0.25;
      yesButton.style.transform = `scale(${scaleFactor})`;
      if (noClickCount === 1) {
        yesButton.textContent = 'really';
      } else if (noClickCount === 2) {
        yesButton.textContent = 'fatoma?';
      } else {
        yesButton.textContent = 'please';
      }
     
      yesButton.animate([
        { transform: 'translateX(0px)' },
        { transform: 'translateX(-10px)' },
        { transform: 'translateX(10px)' },
        { transform: 'translateX(0px)' }
      ], { duration: 300, iterations: 1 });
    });
    
    yesButton.addEventListener('click', () => {
      yesButton.disabled = true;
      noButton.disabled = true;
      message.textContent = 'Iove you fatima';
      cat.style.opacity = '1';
      cat.style.transform = 'translateX(-50%) scale(1)';
      startTulipRain();
    });
    
    function createTulip() {
      const tulip = document.createElement('img');
      tulip.src = 'tulip.png';
      tulip.classList.add('tulip');
      // Random horizontal starting position
      tulip.style.left = Math.random() * 100 + 'vw';
      // Random animation duration between 4 and 8 seconds
      const duration = Math.random() * 4 + 4;
      tulip.style.animationDuration = duration + 's';
      // Random delay for variation
      tulip.style.animationDelay = Math.random() * 2 + 's';
      tulipContainer.appendChild(tulip);
      tulip.addEventListener('animationend', () => {
        tulip.remove();
      });
    }
    
    function startTulipRain() {
      setInterval(createTulip, 300);
    }
    
    function createHeart() {
      const heart = document.createElement('span');
      heart.classList.add('heart');
      heart.innerText = '❤';
      // Random horizontal position
      heart.style.left = Math.random() * 100 + 'vw';
      // Random font size for variety
      heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
      heartContainer.appendChild(heart);
      heart.addEventListener('animationend', () => {
        heart.remove();
      });
    }
  </script>
</body>
</html>
